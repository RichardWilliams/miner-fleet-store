name: ghcr Docker setup
description: Set up Docker Buildx and authenticate to ghcr.io using the workflow token.
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
