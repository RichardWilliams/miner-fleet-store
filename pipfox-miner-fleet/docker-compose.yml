services:
  # Umbrel injects this reverse-proxy/auth service. APP_HOST resolves the
  # application container by its compose-generated name, so the service below
  # MUST be named `server` — the `_server_1` suffix is a hard naming contract,
  # not a convention (DECISIONS.md entry 1).
  app_proxy:
    environment:
      APP_HOST: pipfox-miner-fleet_server_1
      # Container-internal listen port, not the host-facing one. The app's
      # Dockerfile sets ENV PORT=3000 and EXPOSE 3000; the host-facing port the
      # operator reaches is `port: 3007` in umbrel-app.yml.
      APP_PORT: 3000

  server:
    # Pinned by semver tag AND sha256 digest together (DECISIONS.md entry 3).
    # The digest is the multi-arch INDEX digest published by miner-fleet's
    # release-image.yml — not the inner per-platform manifest digest — because
    # umbreld resolves the index. Bump both halves together on every release;
    # DEPLOY.md names this line as one of the two edit sites.
    # The image NAME is also hardcoded in scripts/check-version-drift.sh — see
    # that file's IMAGE_NAME_ERE for why both sites move together.
    image: ghcr.io/richardwilliams/miner-fleet:0.2.0@sha256:83de64211b8e6b0293df25fa718d387f5a07e8c841da80b5792213461f3d50ab
    restart: on-failure
    stop_grace_period: 1m

    # Defense in depth. The app dials arbitrary LAN addresses to reach the
    # miners, so it is worth constraining what a compromised process could do
    # beyond that. It already runs as a non-root user (uid 1000, the node:alpine
    # `node` account) baked into the image; these two make privilege ESCALATION
    # unavailable rather than merely unused. Neither affects outbound TCP/HTTP,
    # which is all the app needs. uid 1000 matches the ownership the volume below
    # actually gets: the app TEMPLATE ships `data/.gitkeep`, so umbreld's install
    # rsync creates ${APP_DATA_DIR}/data owned 1000:1000 (see miner-fleet's
    # docker/Dockerfile and its own DECISIONS.md entry 12 — the sibling repo, not
    # this store's DECISIONS.md — for the image's uid). That is what lets the
    # volume be writable with cap_drop: ALL and no chown; see the volume's own
    # comment below and DECISIONS.md entry 6 for why umbreld does not do this on
    # its own.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Surfaces process health to umbreld and the Umbrel UI. Read this for what
    # it does and does NOT buy: Docker's `restart:` policy does not act on
    # health status, so this does NOT auto-restart a hung-but-alive process —
    # that needs an external supervisor acting on the status. What it gives is
    # an honest health signal in place of "the container is running", which is
    # all `restart: on-failure` can report on its own.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Bridge networking, NOT network_mode: host (DECISIONS.md entry 2). A bridge
    # container already reaches arbitrary LAN addresses outbound, which is what
    # sweeping the miners' HTTP API needs; host networking would additionally
    # cost the app_proxy auth layer in front of the app.

    # Persistent data volume (DECISIONS.md entry 6). The app writes its SQLite
    # inventory + telemetry samples under its container-side data dir, default
    # /data (miner-fleet src/config/runtimeConfig.ts, MINER_FLEET_DATA_DIR).
    # ${APP_DATA_DIR} is the HOST-side app-data directory umbreld exports into the
    # compose environment; the ${UMBREL_ROOT}/app-data/${app} contract is cited in
    # the sibling miner-fleet repo (its DECISIONS entry 12 / runtimeConfig.ts) —
    # referenced rather than re-pinned here because the upstream line numbers drift.
    # The shipped-app precedent is vaultwarden's ${APP_DATA_DIR}/data:/data, and
    # specifically its committed `data/.gitkeep` — NOT the `user: "1000:1000"`
    # line beside it, which has no bearing on how Docker creates a MISSING
    # bind-mount source. This directory SURVIVES app updates and is removed only
    # on UNINSTALL (umbreld's update copies the app files over a whitelist that
    # never includes data/; uninstall removes the data dir). See DECISIONS.md
    # entry 6.
    #
    # umbreld does NOT pre-create this bind-mount source on its own. On a fresh
    # install it materialises app-data ONLY by rsyncing the app TEMPLATE into it
    # (`rsync --archive --exclude ".gitkeep" <template>/. <app-data-dir>`,
    # `getumbrel/umbrel` apps.ts install()) — so the sibling
    # `pipfox-miner-fleet/data/.gitkeep` this repo ships is what makes
    # ${APP_DATA_DIR}/data exist, owned 1000:1000, before the container ever
    # starts. Deleting that file does NOT make the directory "already exist
    # anyway" — it silently reintroduces the bug this comment used to hide:
    # Docker creates the missing source root:root at `compose up`, and the
    # uid-1000, cap_drop: ALL container cannot write into it.
    # scripts/check-bind-mount-dirs.sh enforces this mechanically at push time —
    # read it before touching `data/.gitkeep` or this volume line.
    volumes:
      - ${APP_DATA_DIR}/data:/data

    # Operator subnet configuration, delivered so it NEVER enters this PUBLIC repo
    # (DECISIONS.md entry 7; codespace RULE #1 — a real LAN range must never be
    # committed). Discovery auto-derives the sweep range from the container's OWN
    # address, which on Umbrel is the docker app-network, NOT the operator's LAN,
    # so the fleet stays EMPTY until MINER_FLEET_SUBNETS is set (the app reads it
    # from the environment; miner-fleet src/config/runtimeConfig.ts SUBNETS_ENV).
    # umbreld passes a community-app compose NO --env-file and exports no custom
    # vars, so a value here could only be a literal — which either commits the
    # range (RULE #1) or is reset on every update (umbreld replaces this compose
    # on update). Reading it from a file the operator creates INSIDE the data
    # volume avoids both: the file lives on the box, survives updates, and is
    # never committed. required:false so a fresh install with no file yet starts
    # cleanly (empty fleet) instead of failing. Operator setup: DEPLOY.md § 6.
    env_file:
      - path: ${APP_DATA_DIR}/data/config.env
        required: false
